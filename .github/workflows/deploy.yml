name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase config
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_AUTH_DOMAIN: ${{ secrets.FB_AUTH_DOMAIN }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_STORAGE_BUCKET: ${{ secrets.FB_STORAGE_BUCKET }}
          FB_MESSAGING_SENDER_ID: ${{ secrets.FB_MESSAGING_SENDER_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
        run: |
          sed -i "s|YOUR_API_KEY_HERE|$FB_API_KEY|g" index.html
          sed -i "s|YOUR_PROJECT.firebaseapp.com|$FB_AUTH_DOMAIN|g" index.html
          sed -i "s|YOUR_PROJECT_ID|$FB_PROJECT_ID|g" index.html
          sed -i "s|YOUR_PROJECT.appspot.com|$FB_STORAGE_BUCKET|g" index.html
          sed -i "s|000000000000|$FB_MESSAGING_SENDER_ID|g" index.html
          sed -i "s|1:000000000000:web:xxxxxxxxxxxx|$FB_APP_ID|g" index.html
          echo "✅ Firebase config injected"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
